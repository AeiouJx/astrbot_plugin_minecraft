<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minecraft Bridge Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; height: 100vh; }
    
    .container { display: flex; height: 100vh; }
    
    /* 左侧：实例列表 */
    .sidebar-left { width: 240px; background: #fff; border-right: 1px solid #e0e0e0; display: flex; flex-direction: column; }
    .sidebar-left .header { padding: 16px; border-bottom: 1px solid #e0e0e0; }
    .sidebar-left .header h3 { font-size: 14px; color: #666; margin-bottom: 8px; }
    .sidebar-left .header .status-badge { display: inline-block; padding: 4px 8px; border-radius: 12px; font-size: 12px; }
    .status-running { background: #e8f5e9; color: #2e7d32; }
    .status-stopped { background: #ffebee; color: #c62828; }
    
    .instance-list { flex: 1; overflow-y: auto; padding: 8px; }
    .instance-item { padding: 12px; margin: 4px 0; border-radius: 8px; cursor: pointer; transition: background 0.2s; }
    .instance-item:hover { background: #f5f5f5; }
    .instance-item.active { background: #e3f2fd; border-left: 3px solid #1976d2; }
    .instance-item .name { font-weight: 500; margin-bottom: 4px; }
    .instance-item .meta { font-size: 12px; color: #888; }
    .instance-item .online-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
    .dot-online { background: #4caf50; }
    .dot-offline { background: #ccc; }
    
    .sidebar-left .footer { padding: 12px; border-top: 1px solid #e0e0e0; }
    .btn { padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; transition: all 0.2s; }
    .btn-primary { background: #1976d2; color: #fff; }
    .btn-primary:hover { background: #1565c0; }
    .btn-danger { background: #d32f2f; color: #fff; }
    .btn-danger:hover { background: #c62828; }
    .btn-outline { background: transparent; border: 1px solid #ddd; color: #666; }
    .btn-outline:hover { background: #f5f5f5; }
    .btn-group { display: flex; gap: 8px; }
    
    /* 中间：消息区域 */
    .main-content { flex: 1; display: flex; flex-direction: column; background: #fff; }
    .main-content .header { padding: 16px; border-bottom: 1px solid #e0e0e0; display: flex; justify-content: space-between; align-items: center; }
    .main-content .header h2 { font-size: 16px; }
    
    .message-area { flex: 1; overflow-y: auto; padding: 16px; }
    .message-item { padding: 10px 12px; margin: 6px 0; border-radius: 8px; background: #f9f9f9; }
    .message-item.chat { border-left: 3px solid #4caf50; }
    .message-item.event { border-left: 3px solid #ff9800; }
    .message-item.system { border-left: 3px solid #9e9e9e; }
    .message-item .time { font-size: 11px; color: #999; margin-bottom: 4px; }
    .message-item .sender { font-weight: 500; color: #333; }
    .message-item .content { color: #555; margin-top: 4px; }
    .message-item .server-tag { font-size: 11px; background: #e3f2fd; color: #1976d2; padding: 2px 6px; border-radius: 4px; margin-right: 6px; }
    
    .input-area { padding: 16px; border-top: 1px solid #e0e0e0; }
    .input-row { display: flex; gap: 8px; }
    .input-row input { flex: 1; padding: 10px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
    .input-row input:focus { outline: none; border-color: #1976d2; }
    
    /* 右侧：配置和状态 */
    .sidebar-right { width: 320px; background: #fff; border-left: 1px solid #e0e0e0; display: flex; flex-direction: column; }
    .sidebar-right .tabs { display: flex; border-bottom: 1px solid #e0e0e0; }
    .sidebar-right .tab { flex: 1; padding: 12px; text-align: center; cursor: pointer; font-size: 13px; color: #666; }
    .sidebar-right .tab.active { color: #1976d2; border-bottom: 2px solid #1976d2; }
    
    .tab-content { flex: 1; overflow-y: auto; padding: 16px; }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }
    
    .config-item { margin-bottom: 16px; }
    .config-item label { display: block; font-size: 12px; color: #666; margin-bottom: 6px; }
    .config-item input, .config-item select { width: 100%; padding: 8px 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 13px; }
    .config-item input:focus, .config-item select:focus { outline: none; border-color: #1976d2; }
    .config-item .hint { font-size: 11px; color: #999; margin-top: 4px; }
    
    .status-card { padding: 12px; background: #f9f9f9; border-radius: 8px; margin-bottom: 12px; }
    .status-card .label { font-size: 12px; color: #888; }
    .status-card .value { font-size: 18px; font-weight: 600; margin-top: 4px; }
    
    .action-buttons { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
    .action-buttons .btn { width: 100%; }
    
    .empty-state { text-align: center; padding: 40px 20px; color: #999; }
    .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
  </style>
</head>
<body>
  <div class="container">
    <!-- 左侧：实例列表 -->
    <div class="sidebar-left">
      <div class="header">
        <h3>Minecraft 实例</h3>
        <span id="ws-status" class="status-badge status-stopped">未连接</span>
      </div>
      <div class="instance-list" id="instance-list">
        <!-- 动态填充 -->
      </div>
      <div class="footer">
        <div class="btn-group">
          <button class="btn btn-primary" onclick="startWs()">启动</button>
          <button class="btn btn-danger" onclick="stopWs()">停止</button>
          <button class="btn btn-outline" onclick="refreshInstances()">刷新</button>
        </div>
      </div>
    </div>
    
    <!-- 中间：消息区域 -->
    <div class="main-content">
      <div class="header">
        <h2 id="current-instance">选择一个实例</h2>
        <button class="btn btn-outline" onclick="clearMessages()">清空消息</button>
      </div>
      <div class="message-area" id="message-area">
        <div class="empty-state">
          <div class="icon">💬</div>
          <p>选择左侧实例查看消息</p>
        </div>
      </div>
      <div class="input-area">
        <div class="input-row">
          <input type="text" id="chat-input" placeholder="发送消息到 Minecraft..." onkeypress="if(event.key==='Enter')sendChat()">
          <button class="btn btn-primary" onclick="sendChat()">发送</button>
        </div>
      </div>
    </div>
    
    <!-- 右侧：配置和状态 -->
    <div class="sidebar-right">
      <div class="tabs">
        <div class="tab active" onclick="switchTab('status')">状态</div>
        <div class="tab" onclick="switchTab('config')">配置</div>
      </div>
      <div class="tab-content">
        <!-- 状态面板 -->
        <div class="tab-panel active" id="panel-status">
          <div class="status-card">
            <div class="label">在线实例</div>
            <div class="value" id="online-count">0</div>
          </div>
          <div class="status-card">
            <div class="label">监听地址</div>
            <div class="value" id="listen-addr" style="font-size:14px;">-</div>
          </div>
          <div id="instance-detail">
            <div class="empty-state">
              <p>选择实例查看详情</p>
            </div>
          </div>
        </div>
        
        <!-- 配置面板 -->
        <div class="tab-panel" id="panel-config">
          <div class="config-item">
            <label>WebSocket 监听地址</label>
            <input type="text" id="cfg-ws-host" value="0.0.0.0">
          </div>
          <div class="config-item">
            <label>WebSocket 监听端口</label>
            <input type="number" id="cfg-ws-port" value="8765">
          </div>
          <div class="config-item">
            <label>连接认证 Token</label>
            <input type="password" id="cfg-token" value="change-me">
            <div class="hint">两端必须一致</div>
          </div>
          <div class="config-item">
            <label>默认服务器实例 ID</label>
            <input type="text" id="cfg-default-server" value="default">
          </div>
          <div class="config-item">
            <label>事件推送群号</label>
            <input type="text" id="cfg-event-group" placeholder="QQ 群号">
          </div>
          <div class="config-item">
            <label>
              <input type="checkbox" id="cfg-chat-push"> 启用聊天推送到群
            </label>
          </div>
          <div class="config-item">
            <label>
              <input type="checkbox" id="cfg-event-push"> 启用事件推送到群
            </label>
          </div>
          <button class="btn btn-primary" onclick="saveConfig()" style="width:100%;margin-top:16px;">保存配置</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    let instances = [];
    let selectedInstance = null;
    let messages = [];
    
    // 加载状态
    async function loadStatus() {
      try {
        const resp = await fetch('/astrbot_plugin_minecraft_bridge/status');
        const data = await resp.json();
        const status = data.status || data;
        
        document.getElementById('ws-status').textContent = status.ws_running ? '运行中' : '未连接';
        document.getElementById('ws-status').className = `status-badge ${status.ws_running ? 'status-running' : 'status-stopped'}`;
        document.getElementById('online-count').textContent = status.online_count || 0;
        document.getElementById('listen-addr').textContent = `ws://${status.ws_host || '0.0.0.0'}:${status.ws_port || 8765}`;
        
        instances = status.servers || [];
        renderInstances();
      } catch (e) {
        console.error('加载状态失败:', e);
      }
    }
    
    // 渲染实例列表
    function renderInstances() {
      const list = document.getElementById('instance-list');
      if (instances.length === 0) {
        list.innerHTML = '<div class="empty-state"><p>暂无已连接实例</p></div>';
        return;
      }
      
      list.innerHTML = instances.map(inst => `
        <div class="instance-item ${selectedInstance === inst.server_id ? 'active' : ''}" 
             onclick="selectInstance('${inst.server_id}')">
          <div class="name">
            <span class="online-dot dot-online"></span>
            ${inst.server_id}
          </div>
          <div class="meta">Mod: ${inst.mod_version || '-'} | Caps: ${(inst.capabilities || []).join(', ')}</div>
        </div>
      `).join('');
    }
    
    // 选择实例
    function selectInstance(serverId) {
      selectedInstance = serverId;
      document.getElementById('current-instance').textContent = serverId;
      renderInstances();
      renderInstanceDetail();
    }
    
    // 渲染实例详情
    function renderInstanceDetail() {
      const inst = instances.find(i => i.server_id === selectedInstance);
      if (!inst) {
        document.getElementById('instance-detail').innerHTML = '<div class="empty-state"><p>选择实例查看详情</p></div>';
        return;
      }
      
      document.getElementById('instance-detail').innerHTML = `
        <div class="status-card">
          <div class="label">Mod 版本</div>
          <div class="value" style="font-size:14px;">${inst.mod_version || '-'}</div>
        </div>
        <div class="status-card">
          <div class="label">能力</div>
          <div class="value" style="font-size:14px;">${(inst.capabilities || []).join(', ') || '-'}</div>
        </div>
        <div class="action-buttons">
          <button class="btn btn-outline" onclick="queryPlayers('${inst.server_id}')">查询在线玩家</button>
          <button class="btn btn-outline" onclick="queryStatus('${inst.server_id}')">查询 Bot 状态</button>
        </div>
      `;
    }
    
    // 切换标签
    function switchTab(tab) {
      document.querySelectorAll('.sidebar-right .tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById(`panel-${tab}`).classList.add('active');
    }
    
    // 添加消息
    function addMessage(msg) {
      messages.unshift(msg);
      if (messages.length > 100) messages.pop();
      renderMessages();
    }
    
    // 渲染消息
    function renderMessages() {
      const area = document.getElementById('message-area');
      if (messages.length === 0) {
        area.innerHTML = '<div class="empty-state"><div class="icon">💬</div><p>暂无消息</p></div>';
        return;
      }
      
      area.innerHTML = messages.map(msg => `
        <div class="message-item ${msg.type}">
          <div class="time">
            <span class="server-tag">${msg.server_id}</span>
            ${msg.time}
          </div>
          <div class="sender">${msg.sender || ''}</div>
          <div class="content">${msg.content}</div>
        </div>
      `).join('');
    }
    
    // 清空消息
    function clearMessages() {
      messages = [];
      renderMessages();
    }
    
    // 发送聊天
    async function sendChat() {
      const input = document.getElementById('chat-input');
      const msg = input.value.trim();
      if (!msg || !selectedInstance) return;
      
      try {
        await fetch('/astrbot_plugin_minecraft_bridge/send', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ server_id: selectedInstance, message: msg })
        });
        input.value = '';
        addMessage({
          type: 'chat',
          server_id: selectedInstance,
          sender: 'Bot',
          content: msg,
          time: new Date().toLocaleTimeString()
        });
      } catch (e) {
        console.error('发送失败:', e);
      }
    }
    
    // WS 控制
    async function startWs() {
      await fetch('/astrbot_plugin_minecraft_bridge/start', { method: 'POST' });
      setTimeout(loadStatus, 1000);
    }
    
    async function stopWs() {
      await fetch('/astrbot_plugin_minecraft_bridge/stop', { method: 'POST' });
      setTimeout(loadStatus, 1000);
    }
    
    function refreshInstances() { loadStatus(); }
    
    // 查询
    async function queryPlayers(serverId) {
      addMessage({ type: 'system', server_id: serverId, content: '正在查询在线玩家...', time: new Date().toLocaleTimeString() });
    }
    
    async function queryStatus(serverId) {
      addMessage({ type: 'system', server_id: serverId, content: '正在查询 Bot 状态...', time: new Date().toLocaleTimeString() });
    }
    
    // 保存配置
    async function saveConfig() {
      const config = {
        ws_host: document.getElementById('cfg-ws-host').value,
        ws_port: parseInt(document.getElementById('cfg-ws-port').value),
        shared_token: document.getElementById('cfg-token').value,
        default_server_id: document.getElementById('cfg-default-server').value,
        minecraft_event_group: document.getElementById('cfg-event-group').value,
        chat_push_enabled: document.getElementById('cfg-chat-push').checked,
        server_event_push_enabled: document.getElementById('cfg-event-push').checked
      };
      
      try {
        await fetch('/astrbot_plugin_minecraft_bridge/config/save', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(config)
        });
        alert('配置已保存');
      } catch (e) {
        alert('保存失败: ' + e.message);
      }
    }
    
    // 初始化
    loadStatus();
    setInterval(loadStatus, 5000);
  </script>
</body>
</html>
